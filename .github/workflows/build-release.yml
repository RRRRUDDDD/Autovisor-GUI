name: Build & Release Multi-Platform Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified builds to GitHub Releases
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional release tag (e.g. v1.0.0); blank uses v<version> from source
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate Version & Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.check.outputs.app_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version consistency across Python, Tauri, Cargo, package.json and tag
        id: check
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import tomllib

          ver_py_text = pathlib.Path("modules/version.py").read_text("utf-8")
          m = re.search(r'__gui_version__\s*=\s*"([^"]+)"', ver_py_text)
          if not m:
              sys.exit("无法从 modules/version.py 解析 __gui_version__")
          py_ver = m.group(1).strip()

          tauri_conf = json.loads(pathlib.Path("gui/src-tauri/tauri.conf.json").read_text("utf-8"))
          tauri_ver = str(tauri_conf.get("version") or "").strip()

          cargo_toml = tomllib.loads(pathlib.Path("gui/src-tauri/Cargo.toml").read_text("utf-8"))
          cargo_ver = str((cargo_toml.get("package") or {}).get("version") or "").strip()

          pkg_json = json.loads(pathlib.Path("gui/package.json").read_text("utf-8"))
          pkg_ver = str(pkg_json.get("version") or "").strip()

          versions = {
              "modules/version.py (__gui_version__)": py_ver,
              "gui/src-tauri/tauri.conf.json": tauri_ver,
              "gui/src-tauri/Cargo.toml": cargo_ver,
              "gui/package.json": pkg_ver,
          }
          if not py_ver or len(set(versions.values())) != 1:
              details = ", ".join(f"{k}={v!r}" for k, v in versions.items())
              sys.exit(f"版本号不一致: {details}")

          release_tag = f"v{py_ver}"
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and os.environ.get("GITHUB_REF_NAME"):
              release_tag = os.environ["GITHUB_REF_NAME"].strip()
          elif os.environ.get("REQUESTED_RELEASE_TAG", "").strip():
              release_tag = os.environ["REQUESTED_RELEASE_TAG"].strip()

          normalized_tag = release_tag.lstrip("vV")
          if normalized_tag != py_ver:
              sys.exit(f"Release Tag ({release_tag}) 与源码版本号 ({py_ver}) 不匹配")

          out_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out_path.open("a", encoding="utf-8") as fh:
              fh.write(f"app_version={py_ver}\n")
              fh.write(f"release_tag={release_tag}\n")
          print(f"Validated APP_VERSION={py_ver}, RELEASE_TAG={release_tag}")
          PY

  test:
    name: Verify Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Setup uv & Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Verify backend dependencies and run Python unit tests
        run: |
          uv run --no-sync python backend_server.py --verify-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend test & build
        working-directory: gui
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust unit tests
        working-directory: gui/src-tauri
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-windows:
    name: Build Windows (x64 Installer & Portable)
    needs: [validate-version, test]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      APP_VERSION: ${{ needs.validate-version.outputs.app_version }}
      RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Setup uv & Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Install frontend dependencies
        working-directory: gui
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify frozen Python backend
        run: |
          uv run --with pyinstaller==6.22.3 python build_backend.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $requiredPaths = @(
            "dist/autovisor-backend/autovisor-backend.exe",
            "dist/autovisor-backend/internal/python3.dll",
            "dist/autovisor-backend/internal/numpy",
            "dist/autovisor-backend/internal/cv2",
            "dist/autovisor-backend/resources/stealth.min.js",
            "dist/autovisor-backend/resources/mirrors.json",
            "dist/autovisor-backend/resources/config.ini.example",
            "dist/autovisor-backend/resources/scripts/zhs_dom_extract.js",
            "dist/autovisor-backend/resources/scripts/zhs_tab_switch.js"
          )
          foreach ($p in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $p)) {
              throw "内置后端缺少必需文件或目录: $p"
            }
          }

      - name: Build Windows NSIS Setup Installer
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File gui/build-installer.ps1 -SkipBackendBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Portable Package
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File gui/build-portable.ps1 -SkipBackendBuild -SkipTauriBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $portableDirName = "Autovisor-GUI-$($env:APP_VERSION)-windows-amd64"
          $portableDir = Join-Path "dist" $portableDirName
          $portableBackendExe = Join-Path $portableDir "runtime/autovisor-backend.exe"

          foreach ($item in @(
            (Join-Path $portableDir "Autovisor GUI.exe"),
            (Join-Path $portableDir ".portable"),
            $portableBackendExe
          )) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "便携版目录缺少关键文件: $item"
            }
          }

          & $portableBackendExe --verify-deps
          if ($LASTEXITCODE -ne 0) {
            throw "便携版内置后端依赖自检失败 (exit=$LASTEXITCODE)"
          }
          $strayLogs = Join-Path $portableDir "runtime/logs"
          if (Test-Path -LiteralPath $strayLogs) {
            Remove-Item -Recurse -Force -LiteralPath $strayLogs
          }

          $portableZip = Join-Path "dist" "$portableDirName.zip"
          if (Test-Path -LiteralPath $portableZip) {
            Remove-Item -Force -LiteralPath $portableZip
          }
          Push-Location "dist"
          try {
            7z a -tzip "$portableDirName.zip" "$portableDirName" -mx=7 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "7z 打包便携版失败 (exit=$LASTEXITCODE)"
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autovisor-GUI-Setup-${{ env.APP_VERSION }}-windows-x64
          path: dist/Autovisor-GUI-Setup-${{ env.APP_VERSION }}-windows-x64.exe
          if-no-files-found: error

      - name: Upload Windows Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autovisor-GUI-${{ env.APP_VERSION }}-windows-amd64
          path: dist/Autovisor-GUI-${{ env.APP_VERSION }}-windows-amd64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch }} DMG)
    needs: [validate-version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      PYTHONUTF8: "1"
      APP_VERSION: ${{ needs.validate-version.outputs.app_version }}
      RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Setup uv & Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build and verify frozen Python backend
        run: |
          set -euo pipefail
          uv run --with pyinstaller==6.22.3 python build_backend.py
          test -x dist/autovisor-backend/autovisor-backend
          test -d dist/autovisor-backend/internal/numpy
          test -d dist/autovisor-backend/internal/cv2
          test -f dist/autovisor-backend/resources/stealth.min.js

      - name: Build macOS App Bundle & DMG Installer
        run: |
          set -euo pipefail
          mkdir -p gui/src-tauri/resources/runtime
          touch gui/src-tauri/resources/runtime/.keep
          (cd gui && npx tauri build --bundles app)

          APP_BUNDLE=$(find gui/src-tauri/target -maxdepth 5 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            echo "未找到生成的 macOS .app 包" >&2
            exit 1
          fi
          echo "Bundling frozen runtime into: $APP_BUNDLE"

          RUNTIME_DST="$APP_BUNDLE/Contents/Resources/runtime"
          rm -rf "$RUNTIME_DST"
          mkdir -p "$(dirname "$RUNTIME_DST")"
          cp -R dist/autovisor-backend "$RUNTIME_DST"
          rm -rf "$RUNTIME_DST/logs"
          chmod +x "$RUNTIME_DST/autovisor-backend"

          "$RUNTIME_DST/autovisor-backend" --verify-deps
          rm -rf "$RUNTIME_DST/logs"

          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"

          mkdir -p dist
          DMG_NAME="Autovisor-GUI-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"
          DMG_PATH="dist/$DMG_NAME"
          rm -f "$DMG_PATH"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_BUNDLE" "$STAGE_DIR/Autovisor GUI.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "Autovisor GUI" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGE_DIR"
          ls -lh "$DMG_PATH"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autovisor-GUI-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}
          path: dist/Autovisor-GUI-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux (amd64 DEB & Portable)
    needs: [validate-version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      APP_VERSION: ${{ needs.validate-version.outputs.app_version }}
      RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GTK/WebKit and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            dpkg-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Setup uv & Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build and verify frozen Python backend
        run: |
          set -euo pipefail
          uv run --with pyinstaller==6.22.3 python build_backend.py
          test -x dist/autovisor-backend/autovisor-backend
          test -d dist/autovisor-backend/internal/numpy
          test -d dist/autovisor-backend/internal/cv2
          test -f dist/autovisor-backend/resources/stealth.min.js

      - name: Build Linux DEB Installer & Portable Archive
        run: |
          set -euo pipefail
          rm -rf gui/src-tauri/resources/runtime
          mkdir -p gui/src-tauri/resources
          cp -a dist/autovisor-backend gui/src-tauri/resources/runtime
          rm -rf gui/src-tauri/resources/runtime/logs
          chmod +x gui/src-tauri/resources/runtime/autovisor-backend

          (cd gui && npx tauri build --bundles deb)

          mkdir -p dist
          DEB_SRC=$(find gui/src-tauri/target/release/bundle/deb -maxdepth 1 -name "*.deb" -type f | head -n 1)
          if [ -z "$DEB_SRC" ] || [ ! -f "$DEB_SRC" ]; then
            echo "未找到生成的 Linux .deb 安装包" >&2
            exit 1
          fi
          DEB_DST="dist/Autovisor-GUI-${APP_VERSION}-linux-amd64.deb"
          cp -f "$DEB_SRC" "$DEB_DST"

          MAIN_BIN=""
          for candidate in "gui/src-tauri/target/release/Autovisor GUI" "gui/src-tauri/target/release/autovisor-gui"; do
            if [ -f "$candidate" ]; then
              MAIN_BIN="$candidate"
              break
            fi
          done
          if [ -z "$MAIN_BIN" ]; then
            echo "未找到编译后的 Linux 宿主二进制" >&2
            exit 1
          fi

          PORTABLE_NAME="Autovisor-GUI-${APP_VERSION}-linux-amd64"
          PORTABLE_DIR="dist/$PORTABLE_NAME"
          rm -rf "$PORTABLE_DIR"
          mkdir -p "$PORTABLE_DIR"
          cp -f "$MAIN_BIN" "$PORTABLE_DIR/Autovisor GUI"
          chmod +x "$PORTABLE_DIR/Autovisor GUI"
          ln -sf "Autovisor GUI" "$PORTABLE_DIR/autovisor-gui"
          cp -a dist/autovisor-backend "$PORTABLE_DIR/runtime"
          rm -rf "$PORTABLE_DIR/runtime/logs"
          chmod +x "$PORTABLE_DIR/runtime/autovisor-backend"
          touch "$PORTABLE_DIR/.portable"

          "$PORTABLE_DIR/runtime/autovisor-backend" --verify-deps
          rm -rf "$PORTABLE_DIR/runtime/logs"

          TAR_DST="dist/${PORTABLE_NAME}.tar.gz"
          rm -f "$TAR_DST"
          tar -C dist -czf "$TAR_DST" "$PORTABLE_NAME"
          ls -lh "$DEB_DST" "$TAR_DST"

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autovisor-GUI-${{ env.APP_VERSION }}-linux-amd64-deb
          path: dist/Autovisor-GUI-${{ env.APP_VERSION }}-linux-amd64.deb
          if-no-files-found: error

      - name: Upload Linux Portable Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autovisor-GUI-${{ env.APP_VERSION }}-linux-amd64-portable
          path: dist/Autovisor-GUI-${{ env.APP_VERSION }}-linux-amd64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Verify Checksums & Publish GitHub Release
    needs: [validate-version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.validate-version.outputs.app_version }}
      RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-raw

      - name: Collect and verify all release packages and generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-raw -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp -f {} release-assets/ \;

          cd release-assets
          EXPECTED_FILES=(
            "Autovisor-GUI-Setup-${APP_VERSION}-windows-x64.exe"
            "Autovisor-GUI-${APP_VERSION}-windows-amd64.zip"
            "Autovisor-GUI-${APP_VERSION}-macos-arm64.dmg"
            "Autovisor-GUI-${APP_VERSION}-macos-x64.dmg"
            "Autovisor-GUI-${APP_VERSION}-linux-amd64.deb"
            "Autovisor-GUI-${APP_VERSION}-linux-amd64.tar.gz"
          )
          for f in "${EXPECTED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "缺少发行产物: $f" >&2
              exit 1
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1048576 ]; then
              echo "发行产物体积异常 ($size bytes): $f" >&2
              exit 1
            fi
          done

          sha256sum "${EXPECTED_FILES[@]}" | tee SHA256SUMS.txt
          for f in "${EXPECTED_FILES[@]}"; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload SHA256SUMS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-${{ env.APP_VERSION }}
          path: |
            release-assets/SHA256SUMS.txt
            release-assets/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Autovisor GUI ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Autovisor-GUI-Setup-${{ env.APP_VERSION }}-windows-x64.exe
            release-assets/Autovisor-GUI-${{ env.APP_VERSION }}-windows-amd64.zip
            release-assets/Autovisor-GUI-${{ env.APP_VERSION }}-macos-arm64.dmg
            release-assets/Autovisor-GUI-${{ env.APP_VERSION }}-macos-x64.dmg
            release-assets/Autovisor-GUI-${{ env.APP_VERSION }}-linux-amd64.deb
            release-assets/Autovisor-GUI-${{ env.APP_VERSION }}-linux-amd64.tar.gz
            release-assets/SHA256SUMS.txt
