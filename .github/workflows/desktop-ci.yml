name: Desktop Cross-Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-linux-313:
    name: python (ubuntu / 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv & Python 3.13
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install Python dependencies
        run: uv sync

      - name: Verify captcha & backend dependencies
        run: |
          uv run --no-sync python -c "import cv2, numpy; print(cv2.__version__, numpy.__version__)"
          uv run --no-sync python backend_server.py --verify-deps

      - name: Python unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v

  desktop-check:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GTK/WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Setup uv & Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Verify backend dependencies and run Python unit tests
        run: |
          uv run --no-sync python backend_server.py --verify-deps
          uv run --no-sync python -m unittest discover -s tests -v

      - name: Frontend lint, test & build
        working-directory: gui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Rust check, clippy & unit tests
        working-directory: gui/src-tauri
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings
          cargo test
